<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />

    <!-- Own manifest/app-identity, separate from the main app's — this is
         what lets iOS create a distinct Home Screen icon whose start_url is
         this exact page, instead of always falling back to the main app's
         manifest start_url ("/") and losing the ?open=wallets deep link. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Кошельки" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest-wallets.json" />
    <meta name="theme-color" content="#F4F4F6" />

    <title>Кошельки — Траты</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #f4f4f6;
        font-family: -apple-system, system-ui, sans-serif;
      }
      .hint {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 32px;
        text-align: center;
        color: #16161d;
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="hint">
      Это ярлык для быстрого доступа к «Счетам».<br /><br />
      Добавьте его на экран «Домой» (Поделиться → «На экран Домой»), затем
      открывайте оттуда или через Команды.
    </div>
    <script>
      // Only jump into the app once this page is running as its own
      // installed standalone icon (navigator.standalone — iOS Safari's way
      // to detect a Home-Screen launch), not on a normal Safari-tab visit.
      // Redirecting immediately on every visit would race Add to Home
      // Screen: it needs this page (and its manifest link above) to still
      // be the active document when the Share sheet reads them.
      if (window.navigator.standalone === true) {
        window.location.replace("/?open=wallets");
      }
    </script>
  </body>
</html>
